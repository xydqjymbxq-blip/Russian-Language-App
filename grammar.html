<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/grammar.css" />
  <title>Grammar — Russian</title>
</head>
<body>
  <div class="app-shell">

    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="logo" aria-label="Back to home">
          <span class="logo-letter">Я</span>
          <span class="logo-text">Russian</span>
        </a>
        <button id="grResetBtn" class="gr-reset-btn" title="Start a new session">↺ New session</button>
      </div>
    </header>

    <main class="main gr-main">

      <!-- ── Welcome ── -->
      <div id="grWelcome" class="gr-welcome">
        <div class="gr-welcome-inner">
          <i class="gr-welcome-icon">Г</i>
          <h1 class="gr-welcome-title">Grammar Training</h1>
          <p class="gr-welcome-desc">
            C1–C2 Russian grammar. One exercise at a time,
            with feedback in English.
          </p>
          <div class="gr-welcome-meta">
            <div class="gr-welcome-meta-item">
              <span class="gr-welcome-meta-dot"></span>
              Aspect, subordination, participles &amp; gerunds
            </div>
            <div class="gr-welcome-meta-item">
              <span class="gr-welcome-meta-dot"></span>
              Modality, word order, verbs of motion
            </div>
            <div class="gr-welcome-meta-item">
              <span class="gr-welcome-meta-dot"></span>
              Translation, transformation &amp; error correction
            </div>
          </div>
          <button id="grStartBtn" class="gr-start-btn">Begin session →</button>
        </div>
      </div>

      <!-- ── Chat ── -->
      <div id="grChat" class="gr-chat" hidden>

        <div id="grMessages" class="gr-messages" aria-live="polite" aria-label="Conversation"></div>

        <div class="gr-input-bar">
          <textarea
            id="grInput"
            class="gr-textarea"
            placeholder="Type your answer…"
            rows="1"
            disabled
            aria-label="Your answer"
          ></textarea>
          <button id="grSend" class="gr-send-btn" disabled aria-label="Send">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>

      </div>

    </main>

  </div>

  <script src="js/grammar.js"></script>
</body>
</html>
