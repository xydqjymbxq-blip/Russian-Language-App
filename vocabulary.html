<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/grammar.css" />
  <link rel="stylesheet" href="css/vocabulary.css" />
  <title>Vocabulary — Russian</title>
</head>
<body>
  <div class="app-shell">

    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="logo" aria-label="Back to home">
          <span class="logo-letter">Я</span>
          <span class="logo-text">Russian</span>
        </a>
      </div>
    </header>

    <main class="main vc-main">

      <!-- ── Welcome ── -->
      <div id="vcWelcome" class="vc-screen">
        <div class="gr-welcome-inner">
          <i class="gr-welcome-icon">В</i>
          <h1 class="gr-welcome-title">Vocabulary</h1>
          <p class="gr-welcome-desc">
            Test yourself on your flashcard deck. Type the Russian from memory,
            then mark whether you got it right.
          </p>

          <div id="vcStats" class="vc-stats"></div>

          <button id="vcStartBtn" class="vc-primary-btn">Start quiz →</button>
          <button id="vcBrowseBtn" class="vc-ghost-btn">Browse all cards</button>
          <a href="index.html" class="vc-link">← Home</a>
        </div>
      </div>

      <!-- ── Quiz ── -->
      <div id="vcQuiz" class="vc-screen" hidden>

        <!-- Progress -->
        <div class="vc-progress-row">
          <div class="vc-progress-bar"><div class="vc-progress-fill" id="vcFill"></div></div>
          <span class="vc-progress-text" id="vcProgressText">1 / 10</span>
        </div>

        <!-- Card -->
        <div class="vc-quiz-card" id="vcCard">
          <p class="vc-card-en" id="vcCardEn"></p>
          <p class="vc-card-hint" id="vcCardHint" hidden></p>
        </div>

        <!-- Input phase -->
        <div id="vcInputPhase">
          <textarea id="vcInput" class="vc-input" rows="2" placeholder="Type the Russian…" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
          <div class="vc-btn-row">
            <button id="vcCheckBtn" class="vc-primary-btn">Check →</button>
            <button id="vcSkipBtn" class="vc-ghost-btn">Skip</button>
          </div>
        </div>

        <!-- Result phase -->
        <div id="vcResultPhase" hidden>
          <div class="vc-answer-box" id="vcAnswerBox">
            <span class="vc-answer-label">Answer</span>
            <p class="vc-answer-ru" id="vcAnswerRu"></p>
            <p class="vc-answer-sentence" id="vcAnswerSentence" hidden></p>
            <button class="vc-speak-btn" id="vcSpeakBtn" aria-label="Play audio" title="Hear it">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
          </div>
          <p class="vc-result-msg" id="vcResultMsg"></p>
          <div class="vc-btn-row" id="vcSelfAssess" hidden>
            <button id="vcGotItBtn" class="vc-got-btn">✓ Got it</button>
            <button id="vcMissedBtn" class="vc-missed-btn">✗ Missed it</button>
          </div>
          <button id="vcNextBtn" class="vc-primary-btn" hidden>Next →</button>
        </div>

      </div><!-- /vcQuiz -->

      <!-- ── Summary ── -->
      <div id="vcSummary" class="vc-screen" hidden>
        <div class="gr-welcome-inner">
          <div class="vc-score-circle" id="vcScoreCircle"></div>
          <h2 class="gr-welcome-title" style="margin-top:12px">Quiz complete!</h2>
          <p class="gr-welcome-desc" id="vcSummaryMsg"></p>
          <button id="vcAgainBtn" class="vc-primary-btn">New quiz →</button>
          <button id="vcBrowseBtn2" class="vc-ghost-btn">Browse cards</button>
          <a href="index.html" class="vc-link">← Home</a>
        </div>
      </div>

      <!-- ── Browse ── -->
      <div id="vcBrowse" class="vc-screen" hidden>

        <div class="vc-browse-header">
          <button id="vcBrowseBack" class="vc-back-btn">← Back</button>
          <span class="vc-browse-counter" id="vcBrowseCounter">1 / 100</span>
          <div style="width:60px"></div><!-- spacer -->
        </div>

        <!-- Flip card -->
        <div class="vc-card-scene">
          <div class="vc-flip-card" id="vcFlipCard">
            <div class="vc-flip-front">
              <span class="vc-flip-lang">English</span>
              <p class="vc-flip-word" id="vcFlipEn"></p>
            </div>
            <div class="vc-flip-back">
              <span class="vc-flip-lang">Russian</span>
              <p class="vc-flip-word" id="vcFlipRu"></p>
              <p class="vc-flip-sentence" id="vcFlipSentence"></p>
              <button class="vc-speak-btn vc-flip-speak" id="vcFlipSpeakBtn" aria-label="Play audio">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <p class="vc-flip-hint">Tap card to flip</p>

        <div class="vc-browse-nav">
          <button id="vcBrowsePrev" class="vc-nav-btn">← Prev</button>
          <button id="vcBrowseNext" class="vc-nav-btn">Next →</button>
        </div>

      </div><!-- /vcBrowse -->

    </main>
  </div>

  <script src="js/vocabulary.js"></script>
</body>
</html>
