<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/grammar.css" />
  <link rel="stylesheet" href="css/vocabulary.css" />
  <title>Vocabulary — Russian</title>
</head>
<body>
  <div class="app-shell">

    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="logo" aria-label="Back to home">
          <span class="logo-letter">Я</span>
          <span class="logo-text">Russian</span>
        </a>
      </div>
    </header>

    <main class="main vc-main">

      <!-- ── Welcome ── -->
      <div id="vcWelcome" class="vc-screen vc-welcome">
        <h1 class="vc-welcome-title">Vocabulary</h1>
        <div id="vcStats" class="vc-stats"></div>
        <button id="vcStartBtn" class="vc-primary-btn">Start quiz →</button>
        <a href="index.html" class="vc-text-link">← Home</a>
      </div>

      <!-- ── Quiz ── -->
      <div id="vcQuiz" class="vc-screen vc-session" hidden>

        <div class="vc-session-header">
          <button id="vcQuizBack" class="vc-back-btn">← Back</button>
          <span class="vc-session-label">Recall</span>
          <span class="vc-progress-text" id="vcProgressText">1 / 10</span>
        </div>
        <div class="vc-progress-bar"><div class="vc-progress-fill" id="vcFill"></div></div>

        <div class="vc-panel">

          <!-- Input phase -->
          <div id="vcInputPhase">
            <p class="vc-card-en" id="vcCardEn"></p>
            <textarea id="vcInput" class="vc-input" rows="2"
              placeholder="Type the Russian…"
              autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
            <div class="vc-btn-row">
              <button id="vcCheckBtn" class="vc-primary-btn">Check →</button>
              <button id="vcSkipBtn" class="vc-ghost-btn">Skip</button>
            </div>
          </div>

          <!-- Result phase -->
          <div id="vcResultPhase" hidden>
            <p class="vc-card-en" id="vcCardEn2"></p>
            <div class="vc-divider"></div>
            <div class="vc-answer-row">
              <p class="vc-answer-ru" id="vcAnswerRu"></p>
              <button class="vc-speak-btn" id="vcSpeakBtn" aria-label="Play audio">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
              </button>
            </div>
            <p class="vc-answer-sentence" id="vcAnswerSentence" hidden></p>
            <p class="vc-result-msg" id="vcResultMsg"></p>
            <div class="vc-btn-row" id="vcSelfAssess" hidden>
              <button id="vcGotItBtn" class="vc-got-btn">✓ Got it</button>
              <button id="vcMissedBtn" class="vc-missed-btn">✗ Missed it</button>
            </div>
            <button id="vcNextBtn" class="vc-primary-btn" hidden>Next →</button>
          </div>

        </div><!-- /vc-panel -->
      </div><!-- /vcQuiz -->

      <!-- ── Summary ── -->
      <div id="vcSummary" class="vc-screen vc-welcome" hidden>
        <div class="vc-score-circle" id="vcScoreCircle"></div>
        <p class="vc-summary-msg" id="vcSummaryMsg"></p>
        <button id="vcAgainBtn" class="vc-primary-btn">Again →</button>
        <a href="index.html" class="vc-text-link">← Home</a>
      </div>

    </main>
  </div>

  <script src="js/vocabulary.js"></script>
</body>
</html>
