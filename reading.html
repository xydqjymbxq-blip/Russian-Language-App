<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/grammar.css" />
  <link rel="stylesheet" href="css/drills.css" />
  <link rel="stylesheet" href="css/reading.css" />
  <title>Reading Comprehension — Russian</title>
</head>
<body>
  <div class="app-shell">

    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="logo" aria-label="Back to home">
          <span class="logo-letter">Я</span>
          <span class="logo-text">Russian</span>
        </a>
        <button id="rdNewBtn" class="gr-reset-btn" hidden>↺ New passage</button>
      </div>
    </header>

    <main class="main rd-main">

      <!-- ── Welcome ── -->
      <div id="rdWelcome" class="rd-welcome">
        <div class="gr-welcome-inner">
          <i class="gr-welcome-icon">Ч</i>
          <h1 class="gr-welcome-title">Reading Comprehension</h1>
          <p class="gr-welcome-desc">
            A short passage on a current affairs topic,
            with comprehension questions and vocabulary support.
          </p>

          <!-- Level selector -->
          <div class="dr-levels" role="group" aria-label="Select level">
            <button class="dr-level-btn dr-level-btn--active" data-level="C1">C1</button>
            <button class="dr-level-btn" data-level="C2">C2</button>
          </div>

          <!-- Topic suggestions -->
          <p class="gr-topics-label">Choose a topic</p>
          <div id="rdTopics" class="gr-topics"></div>
          <button id="rdShuffleBtn" class="dr-shuffle-btn">↻ New suggestions</button>
        </div>
      </div>

      <!-- ── Loading ── -->
      <div id="rdLoading" class="rd-loading" hidden>
        <div class="rd-spinner"></div>
        <p class="rd-loading-text">Generating your passage…</p>
        <p class="rd-loading-sub">This takes around 5–10 seconds</p>
      </div>

      <!-- ── Reading ── -->
      <div id="rdReading" class="rd-reading" hidden>

        <!-- Meta bar -->
        <div class="rd-meta">
          <span id="rdLevelBadge" class="rd-level-badge"></span>
          <span id="rdTopicLabel" class="rd-topic-label"></span>
        </div>

        <!-- Passage -->
        <article id="rdPassage" class="rd-passage" aria-label="Reading passage"></article>

        <!-- Highlight hint -->
        <p class="rd-hint">Select any word or phrase to get an explanation.</p>

        <!-- Questions section -->
        <div class="rd-qs-section">
          <button id="rdQsToggle" class="rd-qs-toggle">
            <span id="rdQsToggleLabel">Show comprehension questions</span>
            <svg class="rd-qs-toggle-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          <div id="rdQs" class="rd-qs" hidden>
            <ol id="rdQsList" class="rd-qs-list"></ol>
            <button id="rdCheckBtn" class="rd-check-btn">Check answers →</button>
          </div>
        </div>

        <!-- Footer -->
        <div class="rd-footer">
          <button id="rdRetryBtn" class="rd-footer-btn">↻ New passage</button>
          <a href="index.html" class="rd-footer-btn">← Home</a>
        </div>

      </div>

    </main>
  </div>

  <!-- ── Explain bar (fixed, appears on text selection) ── -->
  <div id="rdExplainBar" class="rd-explain-bar" aria-hidden="true">
    <span id="rdExplainPreview" class="rd-explain-preview"></span>
    <button id="rdExplainTrigger" class="rd-explain-trigger">Explain →</button>
    <button id="rdExplainBarDismiss" class="rd-explain-dismiss" aria-label="Dismiss">×</button>
  </div>

  <!-- ── Explain panel (fixed bottom sheet) ── -->
  <div id="rdExplainPanel" class="rd-explain-panel" aria-hidden="true">
    <div class="rd-explain-panel-inner">
      <div class="rd-explain-panel-hdr">
        <span id="rdExplainWord" class="rd-explain-word"></span>
        <button id="rdExplainClose" class="rd-explain-close" aria-label="Close">×</button>
      </div>
      <div id="rdExplainBody" class="rd-explain-body">
        <span class="gr-dots"><span></span><span></span><span></span></span>
      </div>
    </div>
  </div>

  <script src="js/reading.js"></script>
</body>
</html>
